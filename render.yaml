databases:
  - name: cspg-db
    plan: free
    databaseName: cspg
    user: cspg

services:
  - type: web
    name: cspg-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate --noinput && python manage.py ensure_superuser && python manage.py seed_series && python manage.py seed_activites && gunicorn config.wsgi --log-file -"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: cspg-db
          property: connectionString
      - key: DJANGO_DB_SSL_REQUIRE
        value: "True"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CLOUDINARY_URL
        sync: false

  - type: web
    name: cspg-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
